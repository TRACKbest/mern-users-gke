apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mern-ingress
  namespace: mern-app
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "mern-app-ip"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    kubernetes.io/ingress.allow-http: "false"
spec:
  tls:
    - hosts:
        # Remplacez <YOUR_EXTERNAL_IP> par votre IP statique GKE
        - "<YOUR_EXTERNAL_IP>.nip.io"
      secretName: mern-app-tls-secret
  defaultBackend:
    service:
      name: frontend-service
      port:
        number: 80
  rules:
    # Remplacez <YOUR_EXTERNAL_IP> par votre IP statique GKE
    - host: "<YOUR_EXTERNAL_IP>.nip.io"
      http:
        paths:
          - path: /api/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend-service
                port:
                  number: 5000
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
